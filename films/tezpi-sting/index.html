<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <!-- vendored, never CDN: the egress proxy blocks jsDelivr and a failed timeline script blocks render -->
    <link rel="stylesheet" href="vendor/tokens.css">
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/tokens.js"></script>
    <script src="vendor/tezpi-motion.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--canvas-deep); }
      /* seam-craft: opaque stage ground — seams open summed-opacity < 1 windows that flash white otherwise */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--canvas-deep, var(--canvas));
        color: var(--ink);
        font-family: var(--font-sans);
        font-feature-settings: "ss01", "cv11";
      }
      #ground { position: absolute; inset: 0; background: var(--canvas); }
      /* scene slots are the seam carriers (#el-*): seam-stamp drives them on this master timeline */
      [data-composition-id="main"] > div[data-composition-src] { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-j1bx" id="root" data-composition-id="main" data-start="0" data-duration="8.1" data-width="1920" data-height="1080">
      <div data-hf-id="hf-7hg0" id="ground"></div>

      <div data-hf-id="hf-85jx" id="el-hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="2.6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-4ke6" id="el-claim" data-composition-id="claim" data-composition-src="compositions/claim.html" data-start="2.6" data-duration="3.3" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div data-hf-id="hf-wklv" id="el-payoff" data-composition-id="payoff" data-composition-src="compositions/payoff.html" data-start="5.9" data-duration="2.2" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>

    <script>
      // Master timeline owns ONLY the seams. Scene motion lives in each sub-composition.
      // Plan: motion-spec.md · Vectors: ledger.json · Regenerate: npm run seam:stamp -- tezpi-sting
      var tl = gsap.timeline({ paused: true });

      // <seams:auto> — generated by seam-stamp.mjs from ledger.json; do not hand-edit.
      // Regenerate: node <motion-doctrine>/scripts/seam-stamp.mjs --ledger ledger.json --write index.html
      gsap.set("#el-hook", { autoAlpha: 1, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set(["#el-claim"], { autoAlpha: 0, xPercent: 0, yPercent: 0, scale: 1, filter: "blur(0px)", transformOrigin: "50% 50%" });
      gsap.set("#el-payoff", { autoAlpha: 0, scale: 1.25, filter: "blur(10px)", xPercent: 0, yPercent: 0, transformOrigin: "50% 50%" });
      
      // SEAM — hook→claim : cut-the-curve LEFT (cut @2.6)
      tl.to("#el-hook", { xPercent: -12, autoAlpha: 0, duration: 0.34, ease: "power3.in" }, 2.26);
      tl.set("#el-hook", { autoAlpha: 0 }, 2.6);
      tl.fromTo("#el-claim", { xPercent: 10, autoAlpha: 0.35 }, { xPercent: 0, autoAlpha: 1, duration: 0.42, ease: "power4.out", immediateRender: false }, 2.6);
      
      // SEAM — claim→payoff : inverse zoom-through (arrival) (cut @5.9)
      tl.to("#el-claim", { scale: 0.8, filter: "blur(10px)", duration: 0.21, ease: "power3.in" }, 5.69);
      tl.to("#el-claim", { autoAlpha: 0, duration: 0.21, ease: "none" }, 5.69);
      tl.set("#el-claim", { autoAlpha: 0 }, 5.9);
      tl.fromTo("#el-payoff", { autoAlpha: 0.15, scale: 1.25, filter: "blur(10px)" }, { autoAlpha: 1, scale: 1.0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false }, 5.9);
      
      // </seams:auto>

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
