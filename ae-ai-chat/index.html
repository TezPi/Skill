<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <span class="ctx" id="ctx" title="The AI acts on this composition">…</span>
    <button type="button" class="icon" id="undo" aria-label="Undo last edit in After Effects" title="Undo last edit">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 2 7l4 4M2.5 7H10a4 4 0 0 1 0 8H8"/></svg>
    </button>
    <button type="button" class="icon" id="new" aria-label="New chat" title="New chat">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <button type="button" class="icon" id="open-settings" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
    </button>
  </header>

  <main id="log" class="log" role="log" aria-live="polite">
    <section class="empty" id="empty">
      <h1>What should we change?</h1>
      <p>Claude reads your active comp and edits it directly. Each edit is one undo step.</p>
      <p class="skills-hint" id="skills-hint" hidden></p>
      <div class="chips">
        <button type="button" class="chip">Add a subtle wiggle to the selected layers</button>
        <button type="button" class="chip">Stagger the selected layers by 4 frames</button>
        <button type="button" class="chip">Create a lower-third title that says "Hello"</button>
      </div>
    </section>
  </main>

  <form class="composer" id="composer">
    <label for="input" class="sr-only">Message</label>
    <textarea id="input" rows="1" placeholder="Describe an edit…" autocomplete="off"></textarea>
    <div class="composer-bar">
      <label for="agent" class="sr-only">Agent</label>
      <select id="agent" class="agent-select" title="Agent and model for the next message"></select>
      <button type="submit" id="send" class="send" aria-label="Send" title="Send (Enter)">
        <svg class="i-send" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>
        <svg class="i-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>
      </button>
    </div>
  </form>

  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog" class="settings">
      <h2 id="settings-title">Settings</h2>
      <label>Anthropic API key
        <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
      </label>
      <p class="note">The key is stored only in this panel on this computer.</p>
      <label class="check"><input id="review" type="checkbox"> Review code before it runs</label>
      <fieldset class="agents">
        <legend>Agents <span class="note">— each has its own model</span></legend>
        <div id="agent-list" class="agent-list"></div>
        <button type="button" id="add-agent" class="btn ghost add">+ Add agent</button>
      </fieldset>
      <div class="actions">
        <button value="cancel" class="btn ghost">Cancel</button>
        <button value="save" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <template id="agent-row">
    <div class="agent-row">
      <div class="agent-head">
        <input class="a-name" aria-label="Agent name" placeholder="Agent name" maxlength="40">
        <button type="button" class="icon a-del" aria-label="Delete agent" title="Delete agent">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <select class="a-model" aria-label="Model"></select>
      <textarea class="a-instr" rows="2" aria-label="Role instructions" placeholder="Role instructions (optional), e.g. Focus on typography and easing curves."></textarea>
    </div>
  </template>

  <script src="dist/main.js"></script>
</body>
</html>
